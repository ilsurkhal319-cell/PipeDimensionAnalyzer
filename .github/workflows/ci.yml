name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt ruff
      - name: Check imports
        run: python -c "import openai, pydantic, pymupdf, PIL, tkinter"
      - name: Lint
        run: ruff check analyze.py dimension_probe.py gui.py tests
      - name: Test without API calls
        run: pytest -q
